# 本物の GitHub Actions と Local CI の違いを記録するための調査用 workflow。
# 同じ内容を両方で実行し、ログに出した PARITY-JSON 行を比べる。
name: parity-probe
on:
  workflow_dispatch:
  # parity-weekly.yml から「本物」として呼び出す
  workflow_call:
  push:
    branches: [main]
    # 毎週のレポートのコミットでは動かさない
    paths-ignore:
      - "reports/**"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      answer: ${{ steps.out.outputs.answer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: out
        name: step output
        run: echo "answer=42" >> "$GITHUB_OUTPUT"
      - name: probe
        env:
          CTX_GITHUB: ${{ toJSON(github) }}
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_STEPS: ${{ toJSON(steps) }}
          EXPR_SHA: ${{ github.sha }}
          EXPR_REF_NAME: ${{ github.ref_name }}
          EXPR_EVENT: ${{ github.event_name }}
        run: python3 .github/parity/probe.py probe
      # 失敗を許す step。Local CI が continue-on-error を無視すると job がここで止まるため、
      # 主要な情報を集める probe より後に置く
      - id: soft-fail
        name: continue-on-error step
        continue-on-error: true
        run: exit 3
      - name: probe after soft-fail
        if: always()
        env:
          SOFT_FAIL: ${{ steps.soft-fail.outcome }}/${{ steps.soft-fail.conclusion }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'EOF'
          import base64, json, os
          data = {"soft_fail": os.environ["SOFT_FAIL"], "job_status": os.environ["JOB_STATUS"]}
          print("PARITY-JSON after-soft-fail " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          EOF
  dependent:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: probe needs
        env:
          CTX_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          data = {"needs": json.loads(os.environ["CTX_NEEDS"])}
          print("PARITY-JSON dependent " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY
  # job 単位の continue-on-error。失敗しても run は成功扱いで、後続 job から見た結果を記録する
  soft-job:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      before: ${{ steps.before.outputs.value }}
    steps:
      - id: before
        name: output before failure
        run: echo "value=set-before-failure" >> "$GITHUB_OUTPUT"
      - name: fail the job
        run: exit 4
  after-soft-job:
    # if: を書かない（暗黙の success()）。本物で soft-job が成功扱いなら実行される
    needs: soft-job
    runs-on: ubuntu-latest
    steps:
      - name: probe needs of a continue-on-error job
        env:
          CTX_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          data = {"needs": json.loads(os.environ["CTX_NEEDS"])}
          print("PARITY-JSON after-soft-job " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY

  # ── matrix ──────────────────────────────────────────────────────────────
  # 直積、exclude、include（既存の組み合わせへの追加と新しい組み合わせ）、
  # matrix / strategy コンテキスト。組み合わせごとに別のラベルで記録する
  matrix-basic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        mode: [fast, slow]
        exclude:
          - size: large
            mode: slow
        include:
          - size: small
            mode: fast
            extra: added-by-include
          - size: huge
            mode: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe matrix leg
        env:
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          LEG_NAME: ${{ matrix.size }}-${{ matrix.mode }}
        run: python3 .github/parity/emit.py "matrix-$LEG_NAME" CTX_MATRIX CTX_STRATEGY

  # 前の job の出力から作る matrix（fromJSON）
  matrix-source:
    runs-on: ubuntu-latest
    outputs:
      colors: ${{ steps.colors.outputs.colors }}
    steps:
      - id: colors
        name: list colors
        run: echo 'colors=["red","blue"]' >> "$GITHUB_OUTPUT"
  matrix-dynamic:
    needs: matrix-source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: ${{ fromJSON(needs.matrix-source.outputs.colors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe dynamic leg
        env:
          CTX_MATRIX: ${{ toJSON(matrix) }}
          LEG_NAME: ${{ matrix.color }}
        run: python3 .github/parity/emit.py "matrix-dynamic-$LEG_NAME" CTX_MATRIX

  # 一部の組み合わせだけ失敗を許す（job の continue-on-error を matrix の式で指定）
  matrix-experimental:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        experimental: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe experimental leg
        env:
          CTX_MATRIX: ${{ toJSON(matrix) }}
          LEG_NAME: ${{ matrix.experimental }}
        run: python3 .github/parity/emit.py "matrix-experimental-$LEG_NAME" CTX_MATRIX
      - name: fail the experimental leg
        if: matrix.experimental
        run: exit 5

  # matrix の job を待つ job から見た結果（outputs は最後に終わった組み合わせで決まるので記録しない）
  matrix-after:
    needs: [matrix-basic, matrix-dynamic, matrix-experimental]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe needs of matrix jobs
        env:
          RESULT_BASIC: ${{ needs.matrix-basic.result }}
          RESULT_DYNAMIC: ${{ needs.matrix-dynamic.result }}
          RESULT_EXPERIMENTAL: ${{ needs.matrix-experimental.result }}
        run: python3 .github/parity/emit.py matrix-after RESULT_BASIC RESULT_DYNAMIC RESULT_EXPERIMENTAL

  # step の if: は runner が実行中に評価する。matrix / needs / strategy を読む条件で
  # 実行されたかどうか（steps.<id>.outcome が success か skipped か）を記録する
  step-if:
    needs: matrix-source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: [false, true]
        name: [alpha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: if-matrix-bool
        if: matrix.flag
        run: echo ran
      - id: if-matrix-eq
        if: matrix.name == 'alpha'
        run: echo ran
      - id: if-needs-output
        if: needs.matrix-source.outputs.colors != ''
        run: echo ran
      - id: if-needs-result
        if: needs.matrix-source.result == 'success'
        run: echo ran
      - id: if-strategy
        if: strategy.job-total == 2
        run: echo ran
      - name: probe step if outcomes
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
          LEG_NAME: ${{ matrix.flag }}
        run: python3 .github/parity/emit.py "step-if-$LEG_NAME" OUTCOMES
