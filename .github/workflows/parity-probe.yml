# 本物の GitHub Actions と Local CI の違いを記録するための調査用 workflow。
# 同じ内容を両方で実行し、ログに出した PARITY-JSON 行を比べる。
name: parity-probe
on:
  workflow_dispatch:
  # parity-weekly.yml から「本物」として呼び出す
  workflow_call:
  push:
    branches: [main]
    # 毎週のレポートのコミットでは動かさない
    paths-ignore:
      - "reports/**"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      answer: ${{ steps.out.outputs.answer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: out
        name: step output
        run: echo "answer=42" >> "$GITHUB_OUTPUT"
      - name: probe
        env:
          CTX_GITHUB: ${{ toJSON(github) }}
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_STEPS: ${{ toJSON(steps) }}
          EXPR_SHA: ${{ github.sha }}
          EXPR_REF_NAME: ${{ github.ref_name }}
          EXPR_EVENT: ${{ github.event_name }}
        run: python3 .github/parity/probe.py probe
      # 失敗を許す step。Local CI が continue-on-error を無視すると job がここで止まるため、
      # 主要な情報を集める probe より後に置く
      - id: soft-fail
        name: continue-on-error step
        continue-on-error: true
        run: exit 3
      - name: probe after soft-fail
        if: always()
        env:
          SOFT_FAIL: ${{ steps.soft-fail.outcome }}/${{ steps.soft-fail.conclusion }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'EOF'
          import base64, json, os
          data = {"soft_fail": os.environ["SOFT_FAIL"], "job_status": os.environ["JOB_STATUS"]}
          print("PARITY-JSON after-soft-fail " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          EOF
  dependent:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: probe needs
        env:
          CTX_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          data = {"needs": json.loads(os.environ["CTX_NEEDS"])}
          print("PARITY-JSON dependent " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY
  # job 単位の continue-on-error。失敗しても run は成功扱いで、後続 job から見た結果を記録する
  soft-job:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      before: ${{ steps.before.outputs.value }}
    steps:
      - id: before
        name: output before failure
        run: echo "value=set-before-failure" >> "$GITHUB_OUTPUT"
      - name: fail the job
        run: exit 4
  after-soft-job:
    # if: を書かない（暗黙の success()）。本物で soft-job が成功扱いなら実行される
    needs: soft-job
    runs-on: ubuntu-latest
    steps:
      - name: probe needs of a continue-on-error job
        env:
          CTX_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          data = {"needs": json.loads(os.environ["CTX_NEEDS"])}
          print("PARITY-JSON after-soft-job " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY

  # ── matrix ──────────────────────────────────────────────────────────────
  # 直積、exclude、include（既存の組み合わせへの追加と新しい組み合わせ）、
  # matrix / strategy コンテキスト。組み合わせごとに別のラベルで記録する
  matrix-basic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        mode: [fast, slow]
        exclude:
          - size: large
            mode: slow
        include:
          - size: small
            mode: fast
            extra: added-by-include
          - size: huge
            mode: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe matrix leg
        env:
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          LEG_NAME: ${{ matrix.size }}-${{ matrix.mode }}
        run: python3 .github/parity/emit.py "matrix-$LEG_NAME" CTX_MATRIX CTX_STRATEGY

  # 前の job の出力から作る matrix（fromJSON）
  matrix-source:
    runs-on: ubuntu-latest
    outputs:
      colors: ${{ steps.colors.outputs.colors }}
    steps:
      - id: colors
        name: list colors
        run: echo 'colors=["red","blue"]' >> "$GITHUB_OUTPUT"
  matrix-dynamic:
    needs: matrix-source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: ${{ fromJSON(needs.matrix-source.outputs.colors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe dynamic leg
        env:
          CTX_MATRIX: ${{ toJSON(matrix) }}
          LEG_NAME: ${{ matrix.color }}
        run: python3 .github/parity/emit.py "matrix-dynamic-$LEG_NAME" CTX_MATRIX

  # 一部の組み合わせだけ失敗を許す（job の continue-on-error を matrix の式で指定）
  matrix-experimental:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        experimental: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe experimental leg
        env:
          CTX_MATRIX: ${{ toJSON(matrix) }}
          LEG_NAME: ${{ matrix.experimental }}
        run: python3 .github/parity/emit.py "matrix-experimental-$LEG_NAME" CTX_MATRIX
      - name: fail the experimental leg
        if: matrix.experimental
        run: exit 5

  # matrix の job を待つ job から見た結果（outputs は最後に終わった組み合わせで決まるので記録しない）
  matrix-after:
    needs: [matrix-basic, matrix-dynamic, matrix-experimental]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe needs of matrix jobs
        env:
          RESULT_BASIC: ${{ needs.matrix-basic.result }}
          RESULT_DYNAMIC: ${{ needs.matrix-dynamic.result }}
          RESULT_EXPERIMENTAL: ${{ needs.matrix-experimental.result }}
        run: python3 .github/parity/emit.py matrix-after RESULT_BASIC RESULT_DYNAMIC RESULT_EXPERIMENTAL

  # step の if: は runner が実行中に評価する。matrix / needs / strategy を読む条件で
  # 実行されたかどうか（steps.<id>.outcome が success か skipped か）を記録する
  step-if:
    needs: matrix-source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: [false, true]
        name: [alpha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: if-matrix-bool
        if: matrix.flag
        run: echo ran
      - id: if-matrix-eq
        if: matrix.name == 'alpha'
        run: echo ran
      - id: if-needs-output
        if: needs.matrix-source.outputs.colors != ''
        run: echo ran
      - id: if-needs-result
        if: needs.matrix-source.result == 'success'
        run: echo ran
      - id: if-strategy
        if: strategy.job-total == 2
        run: echo ran
      - name: probe step if outcomes
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
          LEG_NAME: ${{ matrix.flag }}
        run: python3 .github/parity/emit.py "step-if-$LEG_NAME" OUTCOMES

  # ── 式の関数と演算子 ────────────────────────────────────────────────────
  # 大文字小文字の扱い、型の変換、format の波かっこ、オブジェクトのフィルタ（.*）など
  expressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: probe expression functions
        env:
          F_CONTAINS: ${{ contains('Hello', 'ell') }}
          F_CONTAINS_ARRAY_CI: ${{ contains(fromJSON('["a","b"]'), 'B') }}
          F_STARTS_CI: ${{ startsWith('Hello', 'he') }}
          F_ENDS_CI: ${{ endsWith('Hello', 'LO') }}
          F_FORMAT: ${{ format('{0}-{1}-{{x}}', 'a', 1) }}
          F_JOIN: ${{ join(fromJSON('["a","b"]'), '+') }}
          F_STR_NUM_EQ: ${{ '1' == 1 }}
          F_STR_CI_EQ: ${{ 'ABC' == 'abc' }}
          F_BOOL_NUM_EQ: ${{ true == 1 }}
          F_OR_FALLBACK: ${{ '' || 'fallback' }}
          F_AND_LAST: ${{ 'x' && 'y' }}
          F_NULL_EQ: ${{ fromJSON('{"k":null}').k == null }}
          F_NOT_ZERO: ${{ !0 }}
          F_LESS_STR: ${{ 'a' < 'B' }}
          F_NUMBER_FMT: ${{ 1.50 }}
          F_HEX: ${{ 0xff }}
          F_INDEX: ${{ fromJSON('{"k":[10,20]}').k[1] }}
          F_FILTER: ${{ toJSON(fromJSON('[{"n":1},{"n":2},{"m":3}]').*.n) }}
          F_TOJSON_TYPES: ${{ toJSON(fromJSON('{"a":1.0,"b":true,"c":null,"d":"s"}')) }}
          F_HASH: ${{ hashFiles('.github/parity/emit.py') }}
          F_HASH_MULTI: ${{ hashFiles('.github/parity/emit.py', '.github/parity/probe.py') }}
          F_HASH_NONE: ${{ hashFiles('no-such-file-*') }}
        run: >-
          python3 .github/parity/emit.py expressions
          F_CONTAINS F_CONTAINS_ARRAY_CI F_STARTS_CI F_ENDS_CI F_FORMAT F_JOIN
          F_STR_NUM_EQ F_STR_CI_EQ F_BOOL_NUM_EQ F_OR_FALLBACK F_AND_LAST F_NULL_EQ F_NOT_ZERO
          F_LESS_STR F_NUMBER_FMT F_HEX F_INDEX F_FILTER F_TOJSON_TYPES F_HASH F_HASH_MULTI F_HASH_NONE

  # ── GITHUB_ENV / GITHUB_PATH、env の優先順位、defaults.run、shell ─────────
  env-files:
    runs-on: ubuntu-latest
    env:
      LEVEL: job
      JOB_ONLY: from-job
    defaults:
      run:
        working-directory: .github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: write env files
        run: |
          echo "FROM_ENV=one" >> "$GITHUB_ENV"
          echo "LEVEL=github-env" >> "$GITHUB_ENV"
          {
            echo "MULTI<<PARITY_EOF"
            echo "line 1"
            echo "line 2"
            echo "PARITY_EOF"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/parity-bin"
          printf '#!/bin/sh\necho tool-on-path\n' > "$HOME/parity-bin/parity-tool"
          chmod +x "$HOME/parity-bin/parity-tool"
          echo "$HOME/parity-bin" >> "$GITHUB_PATH"
      - name: probe env files
        env:
          STEP_ONLY: from-step
          CTX_FROM_ENV: ${{ env.FROM_ENV }}
          CTX_LEVEL: ${{ env.LEVEL }}
          CTX_JOB_ONLY: ${{ env.JOB_ONLY }}
        run: |
          export PWD_NAME="$(basename "$PWD")"
          export TOOL_OUT="$(parity-tool 2>&1 || echo missing)"
          python3 parity/emit.py env-files FROM_ENV LEVEL MULTI JOB_ONLY STEP_ONLY \
            CTX_FROM_ENV CTX_LEVEL CTX_JOB_ONLY PWD_NAME TOOL_OUT
      - name: probe step env over GITHUB_ENV
        env:
          LEVEL: step
        run: python3 parity/emit.py env-files-step-wins LEVEL
      - name: probe shell python
        shell: python
        run: |
          import base64, json, os, sys
          data = {"cwd_name": os.path.basename(os.getcwd()), "from_env": os.environ.get("FROM_ENV"),
                  "is_python": sys.version_info[0] == 3}
          print("PARITY-JSON shell-python " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
      - name: probe shell sh
        shell: sh
        working-directory: .
        run: |
          set -- a b
          export ARGC="$#" PWD_NAME="$(basename "$PWD")"
          python3 .github/parity/emit.py shell-sh ARGC PWD_NAME

  # ── services（サイドカーのコンテナ） ──────────────────────────────────────
  # job.services の中身と、ホスト名・公開ポートのどちらで届くかを記録する
  services:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        env:
          PARITY_SERVICE_ENV: set
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: probe service container
        env:
          SVC: ${{ toJSON(job.services) }}
          MAPPED_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          python3 - <<'PY'
          import base64, json, os, socket
          def ping(host, port):
              try:
                  with socket.create_connection((host, int(port)), timeout=5) as s:
                      s.sendall(b"PING\r\n")
                      return s.recv(16).decode().strip()
              except Exception as e:
                  return type(e).__name__
          svc = json.loads(os.environ["SVC"] or "{}")
          port = os.environ["MAPPED_PORT"]
          redis = svc.get("redis", {})
          data = {
              "names": sorted(svc),
              "fields": sorted(redis),
              "has_mapped_port": bool(port),
              "port_differs_from_container": bool(port) and port != "6379",
              "has_network": bool(redis.get("network")),
              "via_localhost_mapped": ping("localhost", port) if port else "no-port",
              "via_hostname": ping("redis", 6379),
          }
          print("PARITY-JSON services " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY

  # ── actions/cache（同じ run の中で保存して別の job で戻す） ─────────────
  cache-save:
    runs-on: ubuntu-latest
    steps:
      - name: make cache content
        run: mkdir -p .parity-cache && echo "cached-content" > .parity-cache/value
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parity-cache
          key: parity-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: probe cache miss
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          data = {"first_hit": os.environ["HIT"]}
          print("PARITY-JSON cache-save " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY
  cache-restore:
    needs: cache-save
    runs-on: ubuntu-latest
    steps:
      - id: exact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parity-cache
          key: parity-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: read exact
        run: echo "EXACT_VALUE=$(cat .parity-cache/value 2>/dev/null || echo missing)" >> "$GITHUB_ENV" && rm -rf .parity-cache
      - id: prefix
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parity-cache
          key: parity-no-such-key-${{ github.run_id }}
          restore-keys: parity-cache-${{ github.run_id }}-
      - id: miss
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parity-miss
          key: parity-never-saved-${{ github.run_id }}
      - name: probe cache restore
        env:
          EXACT_HIT: ${{ steps.exact.outputs.cache-hit }}
          EXACT_MATCH_OK: ${{ steps.exact.outputs.cache-matched-key == format('parity-cache-{0}-{1}', github.run_id, github.run_attempt) }}
          PREFIX_HIT: ${{ steps.prefix.outputs.cache-hit }}
          PREFIX_MATCH_OK: ${{ steps.prefix.outputs.cache-matched-key == format('parity-cache-{0}-{1}', github.run_id, github.run_attempt) }}
          MISS_HIT: ${{ steps.miss.outputs.cache-hit }}
          MISS_MATCHED: ${{ steps.miss.outputs.cache-matched-key }}
        run: |
          export PREFIX_VALUE="$(cat .parity-cache/value 2>/dev/null || echo missing)"
          python3 - <<'PY'
          import base64, json, os
          names = ["EXACT_HIT", "EXACT_MATCH_OK", "EXACT_VALUE", "PREFIX_HIT", "PREFIX_MATCH_OK",
                   "PREFIX_VALUE", "MISS_HIT", "MISS_MATCHED"]
          data = {n: os.environ.get(n) for n in names}
          print("PARITY-JSON cache-restore " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY

  # ── 再利用ワークフロー（inputs の型と既定値、outputs） ───────────────────
  reusable:
    uses: ./.github/workflows/parity-reusable.yml
    with:
      text: hello
      number: 7
      flag: true
  after-reusable:
    needs: reusable
    runs-on: ubuntu-latest
    steps:
      - name: probe outputs of a reusable workflow
        env:
          CTX_NEEDS: ${{ toJSON(needs) }}
          NUMBER_PLUS: ${{ needs.reusable.outputs.number == 7 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          data = {"needs": json.loads(os.environ["CTX_NEEDS"]), "number_eq_7": os.environ["NUMBER_PLUS"]}
          print("PARITY-JSON after-reusable " + base64.b64encode(json.dumps(data, sort_keys=True).encode()).decode())
          PY
