# 毎週、本物の GitHub Actions と Local CI（Docker）で parity-probe.yml を実行し、違いを reports/gha/ に記録する。
name: parity-weekly
on:
  schedule:
    - cron: "17 0 * * 1"   # 毎週月曜 09:17 JST
  workflow_dispatch:
    inputs:
      localci_source:
        description: "使う Local CI。github:<owner>/<repo>@<branch> でソースからビルド、npm:<package> で npm 版"
        default: "github:playground050/local-ci@fixes/all"
permissions:
  contents: read
env:
  # 入力値は run: に直接埋め込まず、環境変数で渡す（スクリプトへの注入を防ぐ）
  # 毎週の定期実行では、修正を入れた fork を使う
  LCI_SOURCE: ${{ inputs.localci_source || 'github:playground050/local-ci@fixes/all' }}
concurrency:
  group: parity-weekly
  cancel-in-progress: false

jobs:
  native:
    permissions:
      contents: read
    uses: ./.github/workflows/parity-probe.yml

  # わざと失敗する確認項目は別の実行として起動する（この実行は緑のまま）
  native-failing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run parity-probe-failing.yml --ref "$REF"
          id=""
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow parity-probe-failing.yml --event workflow_dispatch --limit 5 \
                   --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$since\")][0].databaseId // empty")
            [ -n "$id" ] && break
            sleep 5
          done
          if [ -z "$id" ]; then echo "::error::parity-probe-failing の実行が見つからない"; exit 1; fi
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          # 失敗するのが正常なので、終わるのを待つだけ
          gh run watch "$id" --interval 15 > /dev/null || true

  localci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # v5 以降は既定でパッケージのキャッシュを有効にするが、ここでは不要
          package-manager-cache: false
      - name: Install Local CI
        run: |
          case "$LCI_SOURCE" in
            github:*@*)
              spec="${LCI_SOURCE#github:}"; repo="${spec%%@*}"; ref="${spec#*@}"
              git clone --quiet --depth 1 --branch "$ref" "https://github.com/$repo.git" "$RUNNER_TEMP/lci-src"
              cd "$RUNNER_TEMP/lci-src"
              corepack enable
              pnpm install --frozen-lockfile
              # CLI は TypeScript のまま Node で動かす。DTU だけはビルド済みの dist を参照する
              pnpm --filter dtu-github-actions build
              printf '#!/bin/sh\nexec node "%s/packages/cli/src/cli.ts" "$@"\n' "$PWD" > "$RUNNER_TEMP/local-ci"
              echo "$LCI_SOURCE ($(git rev-parse --short HEAD))" > "$RUNNER_TEMP/localci.version"
              ;;
            npm:*)
              npm install --prefix "$RUNNER_TEMP/lci" --no-audit --no-fund "${LCI_SOURCE#npm:}"
              printf '#!/bin/sh\nexec "%s" "$@"\n' "$RUNNER_TEMP/lci/node_modules/.bin/local-ci" > "$RUNNER_TEMP/local-ci"
              echo "$LCI_SOURCE" > "$RUNNER_TEMP/localci.version"
              ;;
            *)
              echo "::error::localci_source は github:<owner>/<repo>@<branch> か npm:<package> で指定してください"
              exit 1
              ;;
          esac
          chmod +x "$RUNNER_TEMP/local-ci"
      - name: Run parity-probe.yml with Local CI
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Local CI が失敗・ハングしても比較とレポートまで進めるため、終了コードだけ記録する
          rc=0
          timeout 900 "$RUNNER_TEMP/local-ci" run \
            --workflow .github/workflows/parity-probe.yml --quiet > "$RUNNER_TEMP/localci.out" 2>&1 || rc=$?
          # わざと失敗する確認項目。失敗するのが正常なので終了コードは記録しない
          timeout 600 "$RUNNER_TEMP/local-ci" run \
            --workflow .github/workflows/parity-probe-failing.yml --quiet >> "$RUNNER_TEMP/localci.out" 2>&1 || true
          cat "$RUNNER_TEMP/localci.out"
          echo "LOCALCI_EXIT=$rc" >> "$GITHUB_ENV"
      - name: Collect Local CI step logs
        if: always()
        run: |
          : > "$RUNNER_TEMP/localci.log"
          for d in $(grep -o 'Logs: .*' "$RUNNER_TEMP/localci.out" | sed 's/^Logs: //'); do
            cat "$d"/steps/*.log >> "$RUNNER_TEMP/localci.log" 2>/dev/null || true
          done
          echo "${LOCALCI_EXIT:-unknown}" > "$RUNNER_TEMP/localci.exit"
          grep -c "PARITY-JSON" "$RUNNER_TEMP/localci.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: localci-logs
          path: |
            ${{ runner.temp }}/localci.log
            ${{ runner.temp }}/localci.out
            ${{ runner.temp }}/localci.exit
            ${{ runner.temp }}/localci.version

  compare:
    needs: [native, native-failing, localci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # レポートを push するので、このジョブだけは認証情報を残す（成果物はアップロードしない）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: localci-logs
          path: ${{ runner.temp }}/lci
      - name: Fetch native job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/github.log"
          for id in $(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
                        --jq '.jobs[] | select((.name | startswith("native")) and .conclusion != "skipped") | .id'); do
            # ログには色付け用のエスケープ文字が含まれ、gh api は既定でその出力を拒否する
            # 始まる前に取り消された job（fail-fast など）にはログがない
            gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$id/logs" >> "$RUNNER_TEMP/github.log" \
              || echo "no log for job $id"
          done
          # わざと失敗する確認項目の実行（別の run）のログ
          failing="${{ needs.native-failing.outputs.run_id }}"
          if [ -n "$failing" ]; then
            for id in $(gh api --paginate "repos/${{ github.repository }}/actions/runs/$failing/jobs?per_page=100" \
                          --jq '.jobs[] | select(.conclusion != "skipped") | .id'); do
              gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$id/logs" >> "$RUNNER_TEMP/github.log" \
                || echo "no log for job $id"
            done
          fi
          grep -c "PARITY-JSON" "$RUNNER_TEMP/github.log" || true
      - name: Compare and write report
        run: |
          DATE=$(date -u +%F); R=reports/gha; mkdir -p "$R"
          cat > "$RUNNER_TEMP/meta.json" <<JSON
          {"date": "$DATE", "where": "GitHub Actions (ubuntu-latest, Docker)",
           "commit": "${{ github.sha }}",
           "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "local_ci": "$(cat "$RUNNER_TEMP/lci/localci.version" 2>/dev/null || echo "$LCI_SOURCE")",
           "local_ci_exit": "$(cat "$RUNNER_TEMP/lci/localci.exit" 2>/dev/null || echo unknown)"}
          JSON
          PREV=$(ls "$R"/20*.json 2>/dev/null | grep -v "/$DATE.json" | sort | tail -1 || true)
          python3 .github/parity/compare.py "$RUNNER_TEMP/github.log" "$RUNNER_TEMP/lci/localci.log" \
            --meta "$RUNNER_TEMP/meta.json" --json "$R/$DATE.json" ${PREV:+--prev "$PREV"} \
            --history "$R/history.csv" > "$R/$DATE.md"
          cp "$R/$DATE.md" "$R/latest.md"
          cat "$R/$DATE.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/gha
          git diff --cached --quiet && exit 0
          git commit -m "report: parity (GitHub Actions) $(date -u +%F) [skip ci]"
          # 同じ日に再実行すると同名のレポートがぶつかるため、今回の結果を優先して取り込む
          # （rebase では -X theirs が「今回のコミット側」を指す）
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          exit 1
